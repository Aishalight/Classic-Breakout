<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JS Breakout: Pro Edition</title>
    <style>
        * { 
    box-sizing: border-box; 
    touch-action: none; 
}

body { 
    background: #111; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    height: 100vh; 
    margin: 0; 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow: hidden;
}

#game-container {
    position: relative;
    width: 95vw;
    max-width: 800px;
    aspect-ratio: 3 / 2;
}

canvas { 
    background: #000; 
    border: 3px solid #444; 
    border-radius: 8px;
    width: 100%;
    height: 100%;
    display: block;
}

#overlay {
    position: absolute; 
    top: 0; 
    left: 0; 
    width: 100%; 
    height: 100%;
    display: flex; 
    flex-direction: column; 
    justify-content: center; 
    align-items: center;
    background: rgba(0, 0, 0, 0.85); 
    border-radius: 8px; 
    color: white;
    text-align: center; 
    padding: 20px;
}

button {
    padding: 15px 40px; 
    font-size: 20px; 
    font-weight: bold;
    background: #0095DD; 
    color: white; 
    border: none; 
    border-radius: 8px; 
    cursor: pointer; 
    transition: 0.2s;
}

button:hover { background: #00b4ff; }
button:active { transform: scale(0.95); }

h1 { 
    font-size: clamp(24px, 8vw, 48px); 
    margin: 0 0 10px 0; 
    color: #0095DD; 
}

p { 
    font-size: 18px; 
    margin-bottom: 20px; 
    color: #ccc; 
}
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="600" height="400"></canvas>
    <div id="overlay">
        <h1>BREAKOUT</h1>
        <p id="stats-msg">Press Start, Space, or Enter</p>
        <button id="startBtn">START</button>
    </div>
</div>

<script src="main.js"></script>
</body>
</html>
